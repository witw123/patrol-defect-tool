name: Build Windows native app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PatrolDefect.sln

      - name: Build
        run: dotnet build PatrolDefect.sln --configuration Release --no-restore --maxcpucount:1

      - name: Test
        run: dotnet test PatrolDefect.sln --configuration Release --no-restore --no-build --maxcpucount:1

      - name: Publish unpackaged x64
        run: >
          dotnet publish src/PatrolDefect.App/PatrolDefect.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path 'artifacts/publish/*' -DestinationPath 'artifacts/PatrolDefect-win-x64.zip' -Force

      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatrolDefect-win-x64
          path: artifacts/PatrolDefect-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            --title "巡检缺陷命名分类工具 $env:GITHUB_REF_NAME" `
            --generate-notes `
            artifacts/PatrolDefect-win-x64.zip
